# v1 Project Settings

project = "anipose-pipeline-v1"

# Path to the DeepLabCut model generated via setup_baseline_model.py
model_folder = "C:/Users/jrsch/Documents/umich-ophth-anipose/models/ophtho-baseline-human-Jason-2026-09-29"

# There is one folder ("sample01") between the project rootand videos-raw, so nesting = 1.
nesting = 1

# anipose defaults to .avi files, have to declare the video extension before the [pipeline] portion of the code
video_extension = "MOV"

# Input/output pipeline
[pipeline]
videos_raw = "videos-raw"

# 2D filtering
[filter]
enabled = true

# Length of median filter used to identify tracking jumps.
medfilt = 13

# Maximum deviation from the median-filtered trajectory,
# in pixels, before a point is treated as an outlier.
offset_threshold = 25

# Pose predictions below this confidence are treated as bad.
score_threshold = 0.8

# Use cubic spline interpolation for rejected/missing points.
spline = true

# Visualization
# TODO: replace these names once we know exactly which bodyparts the pose model outputs.
[labeling]
scheme = [
    ["shoulder1", "shoulder2"],
    ["shoulder1", "hip1"],
    ["shoulder2", "hip2"],
    ["hip1", "hip2"],
    ["shoulder1", "elbow1", "wrist1"],
    ["shoulder2", "elbow2", "wrist2"],
    ["chin", "forehead"]
]