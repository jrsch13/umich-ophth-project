# v2 Project Settings

project = "anipose-pipeline-v2"

# Path to the DeepLabCut model generated via setup_baseline_model.py
model_folder = "C:/Users/jrsch/Documents/umich-ophth-anipose/models/ophtho-baseline-human-Jason-2026-09-29"

# There is one folder ("sample01") between the project rootand videos-raw, so nesting = 1.
nesting = 1

# anipose defaults to .avi files, have to declare the video extension before the [pipeline] portion of the code
video_extension = "MOV"

# Input/output pipeline
[pipeline]
videos_raw = "videos-raw"

# 2D filtering
[filter]
enabled = true
type = "medfilt"
medfilt = 13
offset_threshold = 25
score_threshold = 0.8

# trying with no spline this time, Anipose uses linear interpolation instead of the cubic spline with spline = false
spline = false

# Visualization
[labeling]
scheme = [
    ["hip1", "shoulder1", "chin"],
    ["shoulder1", "elbow1", "wrist1"]
]